<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaer.it — Simulatore MVP</title>
<style>
  :root{
    --navy:#0B1F3A; --navy2:#122B4F; --navy3:#1B3A66;
    --orange:#FF6A1A; --orange2:#FF8C00; --red:#FF4500;
    --cream:#FFF6EE; --paper:#FFFFFF; --ink:#10243F;
    --muted:#6B7C93; --line:#E3E8EF; --ok:#1E9E5A; --warn:#E8A100; --bad:#D7392C;
    --chip:#EEF2F7;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--orange);text-decoration:none}
  h1,h2,h3,h4{margin:0 0 .5em}
  .mono{font-family:var(--mono)}

  /* ---------- TOP BAR ---------- */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--orange2),var(--red));
    display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
  header .spacer{flex:1}
  header select,header .wbox{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:8px;padding:7px 10px;font-size:13px}
  header select option{color:#000}
  .roleChips{display:flex;gap:6px}
  .roleChip{padding:6px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);color:#fff;transition:.15s}
  .roleChip.active{background:linear-gradient(135deg,var(--orange2),var(--red));border-color:transparent}
  .roleChip.admin.active{background:#fff;color:var(--navy)}
  .roleChip.disabled{opacity:.35;cursor:not-allowed}
  .wbox{display:flex;align-items:center;gap:7px;font-weight:700}
  .wbox small{font-weight:500;opacity:.7}
  .topbtns{display:flex;gap:6px}
  .topbtns button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}
  .topbtns button:hover{background:rgba(255,255,255,.22)}

  /* ---------- LAYOUT ---------- */
  .shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}
  nav.side{background:var(--paper);border-right:1px solid var(--line);padding:14px 10px}
  nav.side .navsec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 8px 6px;font-weight:700}
  nav.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:9px 11px;border-radius:9px;color:var(--ink);font-size:13.5px;font-weight:600}
  nav.side button:hover{background:var(--chip)}
  nav.side button.active{background:linear-gradient(135deg,rgba(255,140,0,.16),rgba(255,69,0,.10));color:var(--red)}
  nav.side button .ic{width:18px;text-align:center}
  main{padding:22px 26px;overflow:auto}

  /* ---------- COMPONENTS ---------- */
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .pagehead h2{font-size:21px}
  .pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:640px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;
    box-shadow:0 1px 2px rgba(16,36,63,.04)}
  .card h3{font-size:15px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:14px;padding:16px 18px}
  .kpi .v{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .l{font-size:12px;opacity:.78;margin-top:3px}
  .kpi.orange{background:linear-gradient(135deg,var(--orange2),var(--red))}
  label{display:block;font-size:12px;font-weight:700;color:var(--navy2);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  .btn{background:linear-gradient(135deg,var(--orange2),var(--red));color:#fff;border:none;border-radius:9px;
    padding:10px 16px;font-weight:700;font-size:13.5px}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:#fff;color:var(--navy2);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--chip)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .btn.navy{background:linear-gradient(135deg,var(--navy2),var(--navy3))}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  tr:hover td{background:#FAFBFD}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--chip);color:var(--navy2)}
  .tag.ok{background:#E4F6EC;color:var(--ok)} .tag.warn{background:#FCF3DC;color:#9A7200}
  .tag.bad{background:#FBE6E3;color:var(--bad)} .tag.info{background:#E6EEFB;color:#2B5BB5}
  .tag.open{background:#E6EEFB;color:#2B5BB5} .tag.sug{background:#EDE3FB;color:#6B33C0}
  .tag.prog{background:#FCF3DC;color:#9A7200} .tag.done{background:#E4F6EC;color:var(--ok)}
  .tag.exp{background:#EEF1F5;color:#7A8699}
  .pill{font-family:var(--mono);font-size:11.5px;background:var(--navy);color:#fff;padding:2px 8px;border-radius:6px}
  .empty{color:var(--muted);font-style:italic;padding:10px 2px}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange2),var(--red))}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .badge{font-size:11px;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;font-weight:800;margin-left:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:12px 20px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:.25s}
  .toast.show{opacity:1;bottom:30px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin:4px 12px 4px 0}
  .chk input{width:auto}
  .miniledger{max-height:240px;overflow:auto}
  .geo-cities{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .flowbox{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.7}
  .flowbox b{color:var(--orange2)}
  .split-table td{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot">S</span> Shaer.it <span style="font-weight:500;opacity:.6;font-size:12px">· Simulatore MVP</span></div>
  <div class="spacer"></div>
  <div>
    <label style="color:#fff;margin:0 0 3px;opacity:.7;font-size:10px;text-transform:uppercase">Identità attiva</label>
    <select id="actorSelect" onchange="setActor(this.value)"></select>
  </div>
  <div class="roleChips" id="roleChips"></div>
  <div class="wbox" id="walletBox"><small>Crediti</small> <span id="walletVal">0</span></div>
  <div class="topbtns">
    <button onclick="exportData()" title="Salva tutti i dati in un file .json">⬇ Esporta</button>
    <button onclick="document.getElementById('importFile').click()" title="Carica un file .json">⬆ Importa</button>
    <button onclick="resetAll()" title="Cancella tutto e ricarica i dati demo">↺ Reset</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="shell">
  <nav class="side" id="sidenav"></nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   SHAER.IT — SIMULATORE MVP   (standalone, offline, vanilla JS)
   Dati salvati in localStorage + Esporta/Importa su file .json
   ========================================================================== */

const LS_KEY = "shaer_sim_v1";
let state = null;

/* ---------- ID GENERATORS ---------- */
const rid = (n=6)=>Array.from({length:n},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const newProductId  = ()=>"PRD-"+rid();
const newTxnId      = ()=>"TXN-"+rid();
const newCampaignId = ()=>"CMP-"+rid();
const newId         = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now = ()=>Date.now();
const fmt = n => (Math.round(n*100)/100).toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:2});
const today = ()=>new Date().toISOString().slice(0,10);

/* ============================================================================
   SEED DATA — popolazione demo per testare subito un ciclo completo
   ========================================================================== */
function seed(){
  const users = [
    {id:"u_anna",  name:"Anna (Buyer/Seller)", roles:["BUYER","SELLER"], city:"Roma", zone:"Prati", birthday:"06-10", interests:["moda","casa"], credits:120},
    {id:"u_luca",  name:"Luca (Buyer)",         roles:["BUYER"],          city:"Roma", zone:"Trastevere", birthday:"06-08", interests:["sport","tech"], credits:60},
    {id:"u_sara",  name:"Sara (Buyer)",         roles:["BUYER"],          city:"Roma", zone:"Monti", birthday:"12-01", interests:["moda","beauty"], credits:45},
    {id:"u_marco", name:"Marco (Buyer)",        roles:["BUYER"],          city:"Roma", zone:"EUR", birthday:"03-22", interests:["tech"], credits:30},
    {id:"u_gaia",  name:"Gaia (Buyer)",         roles:["BUYER"],          city:"Milano", zone:"Navigli", birthday:"06-12", interests:["casa","moda"], credits:55},
    {id:"u_seller2",name:"Bottega Centro (Seller)", roles:["SELLER"],     city:"Roma", zone:"Centro", birthday:"01-01", interests:[], credits:100},
    {id:"u_prod1", name:"BrandX (Producer)",    roles:["PRODUCER"],       city:"Milano", zone:"", birthday:"01-01", interests:[], credits:1000},
    {id:"u_prod2", name:"Avv. Rossi (Producer/servizi)", roles:["PRODUCER"], city:"Roma", zone:"", birthday:"01-01", interests:[], credits:300},
  ];
  // social graph: chi segue chi (Anna è il nodo centrale)
  const follows = [
    {a:"u_anna",b:"u_luca"},{a:"u_anna",b:"u_sara"},{a:"u_anna",b:"u_marco"},{a:"u_anna",b:"u_gaia"},
    {a:"u_luca",b:"u_anna"},{a:"u_sara",b:"u_anna"},{a:"u_marco",b:"u_anna"},{a:"u_gaia",b:"u_anna"},
    {a:"u_luca",b:"u_sara"},{a:"u_sara",b:"u_luca"},
  ];
  const lists = [
    {id:"lst_fam", ownerId:"u_anna", name:"Famiglia", filter:"familiari", members:["u_sara","u_marco"]},
    {id:"lst_tech",ownerId:"u_anna", name:"Esperti Tech", filter:"interesse:tech", members:["u_luca","u_marco"]},
  ];
  const products = [
    {id:"PRD-DEMOA1", producerId:"u_prod1", name:"Sneaker Aura", category:"sport", basePrice:60, status:"approved", geo:"nazionale"},
    {id:"PRD-DEMOB2", producerId:"u_prod1", name:"Zaino Urban", category:"tech", basePrice:40, status:"approved", geo:"nazionale"},
    {id:"PRD-DEMOC3", producerId:"u_prod2", name:"Consulenza legale 1h", category:"servizi", basePrice:120, status:"approved", geo:"locale"},
    {id:"PRD-PEND04", producerId:"u_prod1", name:"Felpa Nova", category:"moda", basePrice:35, status:"pending", geo:"nazionale"},
  ];
  const contracts = [
    {id:newId(), sellerId:"u_anna",   producerId:"u_prod1", productId:"PRD-DEMOA1", date:today()},
    {id:newId(), sellerId:"u_anna",   producerId:"u_prod1", productId:"PRD-DEMOB2", date:today()},
    {id:newId(), sellerId:"u_seller2",producerId:"u_prod1", productId:"PRD-DEMOA1", date:today()},
  ];
  const catalog = [
    {id:newId(), sellerId:"u_anna",   productId:"PRD-DEMOA1", resalePrice:89, bonusPct:5},
    {id:newId(), sellerId:"u_anna",   productId:"PRD-DEMOB2", resalePrice:59, bonusPct:0},
    {id:newId(), sellerId:"u_seller2",productId:"PRD-DEMOA1", resalePrice:95, bonusPct:3},
  ];
  const campaigns = [
    {id:newCampaignId(), type:"producer", creators:["u_prod1"], productId:"PRD-DEMOA1",
      geoScope:"nazionale", cities:[], audience:"sport", budget:1000, rewardPool:200, dailyCap:300,
      start:today(), end:"", status:"active", spent:0, approvals:{u_prod1:true}},
  ];
  return {
    config:{
      pct_participation:2, pct_chosen:2, pct_purchase:25, pct_cashback:3,
      participation_scope:"all",   // 'all' = tutti i partecipanti | 'chosen' = solo chi ha suggerito il prodotto scelto
      platform_fee:10,             // % che resta a Shaer.it sul pool di vendita (solo informativo qui)
      unreliable_threshold:3, credits_per_euro:100,
      data_share:{producer_geo:true, producer_buyer_aggregated:true, seller_analytics:true}
    },
    users, follows, lists, products, contracts, catalog, campaigns,
    txns:[], ledger:[{id:newId(),ts:now(),userId:"SHAER_ESCROW",type:"escrow_in",amount:1000,note:"Budget campagna demo (CMP)",txnId:""}], notifications:[], wishlist:[
      {id:newId(), ownerId:"u_sara", productId:"PRD-DEMOA1", sellerId:"u_anna", event:"compleanno", target:89, raised:30, contributors:["u_anna"], deadline:"2026-06-30"}
    ],
    shaerEscrow:1000,
    ui:{actor:"u_anna", role:"BUYER", view:"home"}
  };
}

/* ============================================================================
   PERSISTENCE
   ========================================================================== */
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state=seed(); } }
  else state = seed();
}
function resetAll(){ if(confirm("Cancellare tutti i dati e ricaricare la demo?")){ state=seed(); save(); boot(); toast("Dati demo ripristinati"); } }
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="shaer_sim_"+today()+".json"; a.click(); toast("Dati esportati su file");
}
function importData(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ state=JSON.parse(r.result); save(); boot(); toast("Dati importati"); }catch(e){ alert("File non valido"); } };
  r.readAsText(f); ev.target.value="";
}

/* ============================================================================
   HELPERS
   ========================================================================== */
const U      = id => state.users.find(u=>u.id===id) || {name:"?",city:"?"};
const uname  = id => U(id).name;
const prod   = id => state.products.find(p=>p.id===id);
const camp   = id => state.campaigns.find(c=>c.id===id);
const actor  = () => U(state.ui.actor);
const ADMIN  = () => state.ui.role==="ADMIN";
let toastT=null;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

function ledger(userId,type,amount,note,txnId){
  state.ledger.unshift({id:newId(),ts:now(),userId,type,amount:Math.round(amount*100)/100,note,txnId:txnId||""});
}
function addCredits(userId,amount,note,txnId){
  const u=U(userId); if(!u.credits)u.credits=0; u.credits=Math.round((u.credits+amount)*100)/100;
  ledger(userId,amount>=0?"accredito":"addebito",amount,note,txnId);
}
function notify(userId,text,txnId){
  state.notifications.unshift({id:newId(),ts:now(),userId,text,read:false,txnId:txnId||""});
}
function statusTag(s){
  const m={OPEN:"open",SUGGESTED:"sug",IN_PROGRESS:"prog",COMPLETED:"done",EXPIRED:"exp",ABANDONED:"exp"};
  return `<span class="tag ${m[s]||''}">${s}</span>`;
}
// Quante TXN aperte ha un buyer (per regola "inaffidabile")
const openTxnCount = uid => state.txns.filter(t=>t.buyerId===uid && ["OPEN","SUGGESTED","IN_PROGRESS"].includes(t.status)).length;
const isUnreliable = uid => openTxnCount(uid) > state.config.unreliable_threshold;

// Followers che un utente "raggiunge" con una richiesta in base al targeting
function audienceFor(buyerId, targeting){
  // chi segue il buyer = la sua rete che riceve la notifica
  let net = state.follows.filter(f=>f.b===buyerId).map(f=>f.a);
  if(targeting.type==="public"){
    // pubblico: tutti i buyer della piattaforma tranne se stesso
    return state.users.filter(u=>u.roles.includes("BUYER")&&u.id!==buyerId).map(u=>u.id);
  }
  if(targeting.type==="list"){
    const l=state.lists.find(x=>x.id===targeting.listId);
    return l? l.members.filter(m=>m!==buyerId):[];
  }
  return net; // 'friends' = la propria rete
}

/* ============================================================================
   REWARD ENGINE  — cuore del sistema
   ========================================================================== */
// distribuzione alla SCELTA del suggerimento: 2% partecipazione + 2% scelto
function distributeOnChoice(txn){
  const c = txn.campaignId ? camp(txn.campaignId) : null;
  if(!c){ return {note:"Nessuna campagna collegata: nessun budget da distribuire."}; }
  const pool = c.rewardPool;
  const cfg  = state.config;
  const participants = [...new Set(txn.suggestions.map(s=>s.shaererId))];
  const chosenSuggesters = [...new Set(txn.suggestions.filter(s=>s.productId===txn.chosenProductId).map(s=>s.shaererId))];

  let spent=0;
  // --- 2% PARTECIPAZIONE ---
  const baseGroup = cfg.participation_scope==="all" ? participants : chosenSuggesters;
  const baseAmt = pool*cfg.pct_participation/100;
  if(baseGroup.length){
    const per = baseAmt/baseGroup.length;
    baseGroup.forEach(id=>{ addCredits(id,per,`Partecipazione suggerimento (${txn.id})`,txn.id); spent+=per;
      notify(id,`+${fmt(per)} cr · partecipazione a ${txn.id}`,txn.id); });
  }
  // --- +2% SUGGERIMENTO SCELTO ---
  const chosenAmt = pool*cfg.pct_chosen/100;
  if(chosenSuggesters.length){
    const per = chosenAmt/chosenSuggesters.length;
    chosenSuggesters.forEach(id=>{ addCredits(id,per,`Suggerimento scelto dal buyer (${txn.id})`,txn.id); spent+=per;
      notify(id,`+${fmt(per)} cr · il tuo consiglio è stato scelto! (${txn.id})`,txn.id); });
  }
  c.spent += spent; state.shaerEscrow -= spent;
  ledger("SHAER_ESCROW","escrow_out",-spent,`Payout scelta ${txn.id}`,txn.id);
  return {spent, participants:participants.length, chosen:chosenSuggesters.length};
}

// distribuzione all'ACQUISTO verificato: 25% ai suggeritori del prodotto scelto + 3% cashback buyer
function distributeOnPurchase(txn){
  const c = txn.campaignId ? camp(txn.campaignId) : null;
  if(!c){ return {note:"Nessuna campagna collegata."}; }
  const pool=c.rewardPool, cfg=state.config;
  const chosenSuggesters=[...new Set(txn.suggestions.filter(s=>s.productId===txn.chosenProductId).map(s=>s.shaererId))];
  let spent=0;
  const buyAmt=pool*cfg.pct_purchase/100;
  if(chosenSuggesters.length){
    const per=buyAmt/chosenSuggesters.length;
    chosenSuggesters.forEach(id=>{ addCredits(id,per,`Acquisto verificato (${txn.id})`,txn.id); spent+=per;
      notify(id,`+${fmt(per)} cr · acquisto completato grazie a te! (${txn.id})`,txn.id); });
  }
  const cash=pool*cfg.pct_cashback/100;
  addCredits(txn.buyerId,cash,`Cashback acquisto (${txn.id})`,txn.id); spent+=cash;
  notify(txn.buyerId,`+${fmt(cash)} cr · cashback sul tuo acquisto (${txn.id})`,txn.id);
  c.spent+=spent; state.shaerEscrow-=spent;
  ledger("SHAER_ESCROW","escrow_out",-spent,`Payout acquisto ${txn.id}`,txn.id);
  // consumo budget → se esaurito, campagna chiusa
  if(c.spent>=c.budget){ c.status="ended"; notify(c.creators[0],`Campagna ${c.id} terminata: budget esaurito`,""); }
  return {spent, chosen:chosenSuggesters.length, cashback:cash};
}

// anteprima della ripartizione (mostrata nella scheda TXN senza muovere crediti)
function previewSplit(txn){
  const c=txn.campaignId?camp(txn.campaignId):null; if(!c)return null;
  const pool=c.rewardPool,cfg=state.config;
  const participants=[...new Set(txn.suggestions.map(s=>s.shaererId))];
  const chosen= txn.chosenProductId ? [...new Set(txn.suggestions.filter(s=>s.productId===txn.chosenProductId).map(s=>s.shaererId))] : [];
  return {pool, participants:participants.length, chosen:chosen.length,
    base:pool*cfg.pct_participation/100, baseGroup:(cfg.participation_scope==="all"?participants.length:chosen.length),
    bonus:pool*cfg.pct_chosen/100, buy:pool*cfg.pct_purchase/100, cash:pool*cfg.pct_cashback/100};
}

function setView(v){ state.ui.view=v; renderNav(); render(); save(); }
function validView(){ return NAV[state.ui.role].some(([v])=>v===state.ui.view); }
function renderNav(){

  nav.innerHTML=`<div class="navsec">${state.ui.role}</div>`+

      const badge = (v==="feed"&&pendingFeed()>0)?`<span class="badge">${pendingFeed()}</span>`:"";
      return `<button class="${state.ui.view===v?"active":""}" onclick="setView('${v}')">${label}${badge}</button>`;

function pendingFeed(){
  // richieste OPEN che raggiungono l'attore e a cui non ha ancora risposto
  return state.txns.filter(t=>t.status==="OPEN" && t.buyerId!==state.ui.actor &&
    audienceFor(t.buyerId,t.targeting).includes(state.ui.actor) &&

function chooseSuggestion(txnId){

  t.campaignId = c? c.id : null;
  // seller scelto: primo seller che ha quel prodotto in catalogo
  const cat=state.catalog.find(x=>x.productId===t.chosenProductId);
  t.sellerId = cat? cat.sellerId : null;
  t.status="IN_PROGRESS";
  // segna i suggerimenti scelti
  t.suggestions.forEach(s=>s.chosen = s.productId===t.chosenProductId);

function createCampaign(role){
  const me=state.ui.actor;
  const type=document.getElementById("cmp_type").value;
  const budget=+document.getElementById("cmp_budget").value;
  const pool=+document.getElementById("cmp_pool").value;
  const geo=document.getElementById("cmp_geo").value;
  const cities=geo==="città"?document.getElementById("cmp_cities").value.split(",").map(s=>s.trim()).filter(Boolean):[];
  const base={id:newCampaignId(), productId:document.getElementById("cmp_prod").value,
    geoScope:geo, cities, audience:document.getElementById("cmp_aud").value,
    budget, rewardPool:pool, dailyCap:+document.getElementById("cmp_daily").value,
    start:document.getElementById("cmp_start").value, end:document.getElementById("cmp_end").value, spent:0};
  if(type==="collab"){
    const co=[...document.querySelectorAll(".collabCk:checked")].map(c=>c.value);
    const creators=[me,...co];
    const share=Math.round(budget/creators.length);
    const shares={}; creators.forEach(c=>shares[c]=share);
    const approvals={}; creators.forEach(c=>approvals[c]=false); approvals[me]=true;
    // il creatore versa subito la sua quota in escrow
    addCredits(me,-share,`Quota campagna collaborativa (${base.id})`,"");
    state.shaerEscrow+=share; ledger("SHAER_ESCROW","escrow_in",share,`Quota ${uname(me)} ${base.id}`,"");
    co.forEach(c=>notify(c,`Sei stato invitato alla campagna collaborativa ${base.id}. Quota richiesta: ${fmt(share)} cr.`,""));
    state.campaigns.unshift({...base,type:"collab",creators,shares,approvals,status:"pending_approval"});
    toast("Campagna collaborativa creata · in attesa di approvazioni");
  } else {
    // versa budget in escrow subito
    if((actor().credits||0)<budget){ toast("Crediti insufficienti per finanziare il budget"); return; }
    addCredits(me,-budget,`Finanziamento campagna (${base.id})`,"");
    state.shaerEscrow+=budget; ledger("SHAER_ESCROW","escrow_in",budget,`Budget ${base.id}`,"");
    state.campaigns.unshift({...base,type:role.toLowerCase(),creators:[me],approvals:{[me]:true},status:"active"});
    toast("Campagna attiva · budget in escrow Shaer.it");
  }
  save(); render(); renderWallet();
}
function approveCollab(id){
  const c=camp(id); const me=state.ui.actor; const share=c.shares[me]||0;
  if((actor().credits||0)<share){ toast("Crediti insufficienti per la quota"); return; }
  addCredits(me,-share,`Quota campagna collaborativa (${id})`,"");
  state.shaerEscrow+=share; ledger("SHAER_ESCROW","escrow_in",share,`Quota ${uname(me)} ${id}`,"");
  c.approvals[me]=true;
  if(Object.values(c.approvals).every(Boolean)){ c.status="active";
    c.creators.forEach(x=>notify(x,`Campagna ${id} ATTIVA: tutte le quote versate in escrow.`,"")); toast("Approvata · campagna attiva"); }
  else toast("Quota versata · in attesa degli altri");
  save(); render(); renderWallet();
}
function toggleCampaign(id,st){ camp(id).status=st; save(); render(); toast("Campagna "+(st==="active"?"riattivata":"in pausa")); }
function topUp(id){ const c=camp(id); const me=state.ui.actor;
  if((actor().credits||0)<500){toast("Crediti insufficienti");return;}
  addCredits(me,-500,`Ricarica campagna (${id})`,""); c.budget+=500; state.shaerEscrow+=500;
  ledger("SHAER_ESCROW","escrow_in",500,`Top-up ${id}`,""); if(c.status==="ended")c.status="active";
  save(); render(); renderWallet(); toast("Budget ricaricato +500"); }

/* ---- SELLER: conferma vendita (QR) ---- */
function viewConfirm(){
  const me=state.ui.actor;
  const toConfirm=state.txns.filter(t=>t.sellerId===me && t.status==="IN_PROGRESS");
  return head("✅ Conferma vendita (scansione QR simulata)",
    "Il Seller 'scansiona' il QR del buyer in arrivo, vede il payload e conferma la vendita + metodo di pagamento. Questo distribuisce il 25% ai suggeritori e il 3% di cashback.")+
  (toConfirm.length? toConfirm.map(t=>{
    const cat=state.catalog.find(x=>x.productId===t.chosenProductId&&x.sellerId===me);
    return `<div class="card">
      <h3>📷 QR <span class="pill">${t.id}</span></h3>
      <div class="flowbox">
        <b>PAYLOAD QR</b><br>
        Buyer: ${uname(t.buyerId)} (rank ${isUnreliable(t.buyerId)?'⚠️ inaffidabile':'ok'})<br>
        Prodotto richiesto: ${prod(t.chosenProductId)?.name}<br>
        Budget buyer: ${fmt(t.budget)} cr · Crediti disponibili: ${fmt(U(t.buyerId).credits||0)}<br>
        Prezzo vetrina: ${cat?fmt(cat.resalePrice)+'€':'—'}
      </div>
      <div class="row" style="margin-top:12px">
        <div><label>Importo finale vendita (cr)</label><input type="number" id="cf_val_${t.id}" value="${cat?cat.resalePrice:t.budget}"></div>
        <div><label>Metodo pagamento</label><select id="cf_pay_${t.id}"><option>contanti</option><option>carta</option><option>crediti</option><option>misto</option></select></div>
        <div style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn" onclick="confirmSale('${t.id}')">✅ Conferma vendita</button></div>
      </div>
    </div>`;}).join("")
  :`<div class="card"><div class="empty">Nessuna vendita da confermare. Un buyer deve prima scegliere un tuo prodotto.</div></div>`);
}
function confirmSale(txnId){
  const t=state.txns.find(x=>x.id===txnId);
  t.valueFinal=+document.getElementById("cf_val_"+txnId).value;
  t.paymentMethod=document.getElementById("cf_pay_"+txnId).value;
  t.status="COMPLETED"; t.completedAt=now();
  const r=distributeOnPurchase(t);
  // credito recensione (bidirezionale) simbolico
  addCredits(t.sellerId,2,`Vendita completata (${t.id})`,t.id);
  notify(t.buyerId,`Acquisto completato da ${uname(t.sellerId)}! Crediti distribuiti. (${t.id})`,t.id);
  toast(r.spent?`Vendita completata · distribuiti ${fmt(r.spent)} cr (25% + ${fmt(r.cashback)} cashback)`:"Vendita completata (nessuna campagna)");
  save(); render(); renderNav(); renderWallet();
}

/* ============================================================================
   PRODUCER VIEWS
   ========================================================================== */
function viewProducts(){
  const me=state.ui.actor;
  const mine=state.products.filter(p=>p.producerId===me);
  return head("📦 Prodotti & Servizi","Solo il Producer crea prodotti/servizi. Ogni prodotto ottiene un Product ID e resta 'pending' fino all'approvazione ADMIN.")+
  `<div class="card"><h3>Crea prodotto / servizio</h3>
    <div class="row">
      <div><label>Nome</label><input id="p_name" placeholder="es. Sneaker Aura / Consulenza 1h"></div>
      <div><label>Categoria</label><select id="p_cat"><option>sport</option><option>tech</option><option>moda</option><option>beauty</option><option>casa</option><option>servizi</option></select></div>
      <div><label>Prezzo base (€)</label><input type="number" id="p_price" value="50"></div>
      <div><label>Ambito</label><select id="p_geo"><option>nazionale</option><option>regionale</option><option>locale</option><option>globale</option></select></div>
    </div>
    <div style="margin-top:12px"><button class="btn" onclick="createProduct()">➕ Crea (→ in approvazione)</button></div>
  </div>
  <div class="card"><h3>I miei prodotti</h3>
    ${mine.length? `<table><tr><th>Product ID</th><th>Nome</th><th>Categoria</th><th>Prezzo base</th><th>Stato</th><th>Seller che lo vendono</th></tr>`+
      mine.map(p=>{const sellers=state.catalog.filter(c=>c.productId===p.id).length;
        return `<tr><td><span class="pill">${p.id}</span></td><td>${p.name}</td><td>${p.category}</td><td>${fmt(p.basePrice)}€</td>
        <td><span class="tag ${p.status==='approved'?'ok':p.status==='pending'?'warn':'bad'}">${p.status}</span></td><td>${sellers}</td></tr>`;}).join("")+`</table>`
      :`<div class="empty">Nessun prodotto ancora.</div>`}
  </div>`;
}
function createProduct(){const me=state.ui.actor;const name=document.getElementById("p_name").value.trim();if(!name){toast("Inserisci un nome");return;}
  state.products.unshift({id:newProductId(),producerId:me,name,category:document.getElementById("p_cat").value,
    basePrice:+document.getElementById("p_price").value,status:"pending",geo:document.getElementById("p_geo").value});
  toast("Prodotto creato · in attesa di approvazione ADMIN"); save(); render(); }

function viewProducerAnalytics(){
  const me=state.ui.actor;
  const mine=state.products.filter(p=>p.producerId===me);
  const share=state.config.data_share;
  return head("📈 Analytics Producer","Dati aggregati e anonimizzati. L'ADMIN decide quali dati condividere (vedi 'Condivisione dati').")+
  `<div class="grid g3">
    <div class="kpi"><div class="v">${mine.length}</div><div class="l">Prodotti a catalogo</div></div>
    <div class="kpi"><div class="v">${mine.filter(p=>p.status==='approved').length}</div><div class="l">Approvati</div></div>
    <div class="kpi orange"><div class="v">${state.txns.filter(t=>t.status==='COMPLETED'&&mine.some(p=>p.id===t.chosenProductId)).length}</div><div class="l">Vendite verificate</div></div>
  </div>
  <div class="card"><h3>Performance prodotti ${share.producer_geo?'':'<span class="tag bad">geo non condiviso da ADMIN</span>'}</h3>
    <table><tr><th>Prodotto</th><th>In vetrina (n. seller)</th><th>Suggerimenti</th><th>Vendite</th>${share.producer_geo?'<th>Città vendite</th>':''}</tr>
    ${mine.map(p=>{const sells=state.txns.filter(t=>t.status==='COMPLETED'&&t.chosenProductId===p.id);
      const sugg=state.txns.reduce((n,t)=>n+t.suggestions.filter(s=>s.productId===p.id).length,0);
      const cities=share.producer_geo?[...new Set(sells.map(t=>U(t.buyerId).city))].join(", "):'—';
      return `<tr><td>${p.name}</td><td>${state.catalog.filter(c=>c.productId===p.id).length}</td><td>${sugg}</td><td>${sells.length}</td>${share.producer_geo?`<td>${cities||'—'}</td>`:''}</tr>`;}).join("")}
    </table>
  </div>`;
}

/* ============================================================================
   ADMIN VIEWS
   ========================================================================== */
function viewApprovals(){
  const pendP=state.products.filter(p=>p.status==="pending");
  return head("✔️ Approvazioni","Approva prodotti creati dai Producer. (Seller/Producer onboarding: manuale nell'MVP.)")+
  `<div class="card"><h3>Prodotti in attesa (${pendP.length})</h3>
    ${pendP.length? `<table><tr><th>Product ID</th><th>Nome</th><th>Producer</th><th>Categoria</th><th></th></tr>`+
      pendP.map(p=>`<tr><td><span class="pill">${p.id}</span></td><td>${p.name}</td><td>${uname(p.producerId)}</td><td>${p.category}</td>
        <td><button class="btn sm" onclick="approveProduct('${p.id}',1)">Approva</button>
            <button class="btn sm ghost" onclick="approveProduct('${p.id}',0)">Rifiuta</button></td></tr>`).join("")+`</table>`
      :`<div class="empty">Nessun prodotto in attesa.</div>`}
  </div>`;
}
function approveProduct(id,ok){const p=prod(id);p.status=ok?"approved":"rejected";
  notify(p.producerId,`Il tuo prodotto ${p.name} è stato ${ok?"approvato ✅":"rifiutato ❌"}`,"");
  save();render();toast(ok?"Approvato":"Rifiutato");}

function viewConfig(){
  const c=state.config;
  return head("⚙️ Configurazione — Parametri del modello di ricompensa",
    "Qui si testano 'diverse ipotesi di soluzioni efficaci' (punto 10). Cambia le percentuali e la logica e rilancia un ciclo per vedere l'effetto sulla ripartizione.")+
  `<div class="card"><h3>Percentuali ripartizione (sul pool ricompensa della campagna)</h3>
    <div class="row">
      <div><label>% Partecipazione</label><input type="number" step="0.5" value="${c.pct_participation}" onchange="cfg('pct_participation',this.value)"></div>
      <div><label>% Suggerimento scelto</label><input type="number" step="0.5" value="${c.pct_chosen}" onchange="cfg('pct_chosen',this.value)"></div>
      <div><label>% Acquisto verificato</label><input type="number" step="0.5" value="${c.pct_purchase}" onchange="cfg('pct_purchase',this.value)"></div>
      <div><label>% Cashback buyer</label><input type="number" step="0.5" value="${c.pct_cashback}" onchange="cfg('pct_cashback',this.value)"></div>
    </div>
    <div class="divider"></div>
    <label>Ipotesi: chi riceve il 2% di partecipazione?</label>
    <select onchange="cfg('participation_scope',this.value)" style="max-width:420px">
      <option value="all" ${c.participation_scope==='all'?'selected':''}>TUTTI i partecipanti (regola generale)</option>
      <option value="chosen" ${c.participation_scope==='chosen'?'selected':''}>SOLO chi ha suggerito il prodotto scelto (variante dell'esempio)</option>
    </select>
    <p class="hint">Nell'esempio del documento i "2%+2%" vanno agli 8 che hanno suggerito il prodotto scelto; nella regola generale il primo 2% va a tutti i partecipanti. Questo toggle ti fa testare entrambe le ipotesi → da bloccare come decisione (vedi conflitto C13).</p>
    <div class="divider"></div>
    <div class="row">
      <div><label>Soglia "buyer inaffidabile" (TXN aperte)</label><input type="number" value="${c.unreliable_threshold}" onchange="cfg('unreliable_threshold',this.value)"></div>
      <div><label>Crediti per 1 €</label><input type="number" value="${c.credits_per_euro}" onchange="cfg('credits_per_euro',this.value)"></div>
    </div>
  </div>
  <div class="card"><h3>Simulazione veloce della ripartizione</h3>
    <div class="row">
      <div><label>Pool ricompensa (cr)</label><input type="number" id="sim_pool" value="200"></div>
      <div><label>N. partecipanti totali</label><input type="number" id="sim_part" value="20"></div>
      <div><label>N. che hanno suggerito il prodotto scelto</label><input type="number" id="sim_chosen" value="8"></div>
      <div style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn" onclick="simCalc()">Calcola</button></div>
    </div>
    <div id="simOut"></div>
  </div>`;
}
function cfg(k,v){ state.config[k]=isNaN(+v)?v:+v; save(); render(); toast("Parametro aggiornato"); }
function simCalc(){
  const c=state.config, pool=+document.getElementById("sim_pool").value;
  const part=+document.getElementById("sim_part").value, chosen=+document.getElementById("sim_chosen").value;
  const baseGroup=c.participation_scope==='all'?part:chosen;
  const base=pool*c.pct_participation/100, bonus=pool*c.pct_chosen/100, buy=pool*c.pct_purchase/100, cash=pool*c.pct_cashback/100;
  document.getElementById("simOut").innerHTML=`<table class="split-table" style="margin-top:12px">
    <tr><th>Voce</th><th>Totale</th><th>Per persona</th><th>Beneficiari</th></tr>
    <tr><td>Partecipazione (${c.pct_participation}%)</td><td>${fmt(base)}</td><td>${fmt(baseGroup?base/baseGroup:0)}</td><td>${baseGroup}</td></tr>
    <tr><td>Suggerimento scelto (+${c.pct_chosen}%)</td><td>${fmt(bonus)}</td><td>${fmt(chosen?bonus/chosen:0)}</td><td>${chosen}</td></tr>
    <tr><td>Acquisto verificato (${c.pct_purchase}%)</td><td>${fmt(buy)}</td><td>${fmt(chosen?buy/chosen:0)}</td><td>${chosen}</td></tr>
    <tr><td>Cashback buyer (${c.pct_cashback}%)</td><td>${fmt(cash)}</td><td>${fmt(cash)}</td><td>1</td></tr>
    <tr style="font-weight:700"><td>Totale erogato dal pool</td><td>${fmt(base+bonus+buy+cash)}</td><td colspan="2">${fmt((base+bonus+buy+cash)/pool*100)}% del pool</td></tr>
  </table>`;
}

function viewData(){
  return head("🗂️ Tutti i dati","Vista grezza di tutte le tabelle (come saranno in PostgreSQL). Questo è ciò che alimenterà analytics e suggerimenti futuri.")+
  dataTable("transactions (TXN)", state.txns.map(t=>({txn:t.id,buyer:uname(t.buyerId),cat:t.category,stato:t.status,sugg:t.suggestions.length,scelto:t.chosenProductId||"—",seller:t.sellerId?uname(t.sellerId):"—",pay:t.paymentMethod||"—",campagna:t.campaignId||"—"})))+
  dataTable("products", state.products.map(p=>({id:p.id,nome:p.name,producer:uname(p.producerId),cat:p.category,base:p.basePrice,stato:p.status})))+
  dataTable("campaigns", state.campaigns.map(c=>({id:c.id,tipo:c.type,prodotto:prod(c.productId)?.name||"—",budget:c.budget,speso:fmt(c.spent),pool:c.rewardPool,stato:c.status})))+
  dataTable("catalog (vetrine)", state.catalog.map(c=>({seller:uname(c.sellerId),prodotto:prod(c.productId)?.name,rivendita:c.resalePrice,bonus:c.bonusPct+"%"})))+
  `<div class="card"><h3>Wallet escrow Shaer.it (garanzia clienti)</h3>
    <div class="kpi orange" style="max-width:280px"><div class="v">${fmt(state.shaerEscrow)}</div><div class="l">Crediti in garanzia</div></div>
    <p class="hint">Punto 11-12: il budget approvato delle campagne è spostato qui come garanzia e da qui vengono erogate le ricompense.</p></div>`+
  dataTable("credits_ledger (ultimi 40)", state.ledger.slice(0,40).map(l=>({utente:l.userId.startsWith("u_")?uname(l.userId):l.userId,tipo:l.type,cr:fmt(l.amount),nota:l.note,txn:l.txnId||"—"})));
}
function dataTable(title,rows){
  if(!rows.length)return `<div class="card"><h3>${title}</h3><div class="empty">Vuota.</div></div>`;
  const cols=Object.keys(rows[0]);
  return `<div class="card"><h3>${title} <span class="tag">${rows.length}</span></h3>
    <div style="overflow:auto"><table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==='string'&&(r[c].startsWith('TXN-')||r[c].startsWith('PRD-')||r[c].startsWith('CMP-'))?`<span class="pill">${r[c]}</span>`:r[c]}</td>`).join("")}</tr>`).join("")}
    </table></div></div>`;
}

function viewAdminAnalytics(){
  const done=state.txns.filter(t=>t.status==="COMPLETED");
  const gmv=done.reduce((s,t)=>s+(t.valueFinal||0),0);
  const circulating=state.users.reduce((s,u)=>s+(u.credits||0),0);
  const byCat={}; state.txns.forEach(t=>byCat[t.category]=(byCat[t.category]||0)+1);
  return head("🌐 Analytics globali","Overview piattaforma: GMV, crediti circolanti, attività per categoria.")+
  `<div class="grid g4">
    <div class="kpi orange"><div class="v">${fmt(gmv)}</div><div class="l">GMV (cr)</div></div>
    <div class="kpi"><div class="v">${state.txns.length}</div><div class="l">Richieste totali</div></div>
    <div class="kpi"><div class="v">${done.length}</div><div class="l">Acquisti verificati</div></div>
    <div class="kpi"><div class="v">${fmt(circulating)}</div><div class="l">Crediti circolanti</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Richieste per categoria</h3><table><tr><th>Categoria</th><th>Richieste</th></tr>
      ${Object.entries(byCat).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")||'<tr><td colspan=2 class="empty">—</td></tr>'}</table></div>
    <div class="card"><h3>Escrow & flussi</h3>
      <p>In garanzia ora: <b>${fmt(state.shaerEscrow)}</b> cr</p>
      <p>Erogato da escrow: <b>${fmt(state.ledger.filter(l=>l.userId==='SHAER_ESCROW'&&l.amount<0).reduce((s,l)=>s-l.amount,0))}</b> cr</p>
      <p>Versato in escrow: <b>${fmt(state.ledger.filter(l=>l.userId==='SHAER_ESCROW'&&l.amount>0).reduce((s,l)=>s+l.amount,0))}</b> cr</p>
    </div>
  </div>`;
}

function viewShare(){
  const s=state.config.data_share;
  return head("🔐 Condivisione dati","L'ADMIN autorizza quali dati aggregati sono visibili a Producer e Seller (punto 17: 'admin può autorizzare quali dati condividere con chi').")+
  `<div class="card"><h3>Permessi di condivisione</h3>
    <span class="chk"><input type="checkbox" ${s.producer_geo?'checked':''} onchange="shareToggle('producer_geo',this.checked)"> Producer: dati geografici delle vendite</span><br>
    <span class="chk"><input type="checkbox" ${s.producer_buyer_aggregated?'checked':''} onchange="shareToggle('producer_buyer_aggregated',this.checked)"> Producer: profilo acquirenti aggregato</span><br>
    <span class="chk"><input type="checkbox" ${s.seller_analytics?'checked':''} onchange="shareToggle('seller_analytics',this.checked)"> Seller: analytics estese</span>
    <p class="hint">Prova a disattivare "dati geografici" e controlla l'effetto nella vista Analytics del Producer.</p>
  </div>`;
}
function shareToggle(k,v){ state.config.data_share[k]=v; save(); toast("Permesso aggiornato"); }

/* ============================================================================
   START
   ========================================================================== */
load(); boot();
</script>
