<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaer.it — Simulatore MVP v2</title>
<style>
  :root{
    --navy:#0d1b2a; --navy2:#1b2a3d; --ink:#0d1b2a; --paper:#f4f6f9;
    --card:#ffffff; --line:#e2e8f0; --muted:#64748b;
    --orange:#ff7a18; --orange-d:#e85d04; --green:#16a34a; --red:#dc2626;
    --blue:#2563eb; --violet:#7c3aed; --amber:#d97706;
    --promo:#7c3aed; --purchased:#2563eb; --earned:#16a34a;
    --r:14px; --sh:0 1px 3px rgba(13,27,42,.08),0 8px 24px rgba(13,27,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px}
  .logo b{color:var(--orange)}
  .tag{font-size:11px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:99px;color:#cbd5e1}
  .spacer{flex:1}
  select,input,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
  header select{background:rgba(255,255,255,.95);min-width:160px;width:auto}
  .roleswitch{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:11px}
  .roleswitch button{border:0;background:transparent;color:#cbd5e1;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
  .roleswitch button.on{background:var(--orange);color:#fff}
  .roleswitch button:disabled{opacity:.35;cursor:not-allowed}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
  .card h3{margin:0 0 4px;font-size:15px}
  .card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:26px 0 10px;font-weight:700}
  button.act{background:var(--orange);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  button.act:hover{background:var(--orange-d)}
  button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
  button.sm{padding:5px 10px;font-size:12px}
  label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:10px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .pill.promo{background:#f3e8ff;color:var(--promo)}
  .pill.purchased{background:#dbeafe;color:var(--purchased)}
  .pill.earned{background:#dcfce7;color:var(--earned)}
  .pill.ok{background:#dcfce7;color:var(--green)}.pill.wait{background:#fef9c3;color:var(--amber)}.pill.no{background:#fee2e2;color:var(--red)}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv b{font-variant-numeric:tabular-nums}
  .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--sh);z-index:99;opacity:0;transition:.3s;font-size:13px}
  .toast.show{opacity:1}
  .wallet-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .wbox{flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
  .wbox .lab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .wbox .amt{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .classbar{display:flex;height:7px;border-radius:99px;overflow:hidden;margin-top:6px;background:#eef2f7}
  .hint{font-size:11.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin-top:8px}
  .feeprev{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:8px 10px;margin-top:8px;color:#9a3412}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-size:13px}
  .tabs button.on{color:var(--orange);border-bottom-color:var(--orange)}
  svg .axis{stroke:var(--line)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:4px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .stat{text-align:center;padding:6px}
  .badge-v{font-size:10px;background:#dcfce7;color:var(--green);padding:1px 6px;border-radius:99px;font-weight:700}
  .badge-x{font-size:10px;background:#fee2e2;color:var(--red);padding:1px 6px;border-radius:99px;font-weight:700}
  .compact .card{padding:10px}
  .compact h3{font-size:13px}
  .compact .card .sub{font-size:11px;margin-bottom:7px}
  .compact .kv{padding:3px 0;font-size:12px}
  .compact label{margin:6px 0 3px}
  .compact input,.compact select{padding:6px 8px;font-size:12px}
  .compact .hint{font-size:10.5px;padding:6px 8px}
  .friend{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin:3px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">Shaer<b>.it</b></div>
  <span class="tag">Simulatore MVP v2 · motore a partita doppia</span>
  <div class="spacer"></div>
  <select id="userSel" onchange="setUser(this.value)"></select>
  <div class="roleswitch" id="roleSwitch"></div>
  <button id="adminBtn" onclick="toggleAdmin()" style="background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px">🛠 Admin</button>
  <button onclick="ui.view='mydash';render()" style="background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px">📊 La mia dashboard</button>
  <button onclick="ui.view='register';render()" style="background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px">➕ Registrati</button>
</header>

<div class="wrap">
  <div id="walletStrip" class="wallet-strip"></div>
  <div id="panel"></div>

  <h2 class="sec">Strumenti sessione</h2>
  <div class="card">
    <div class="row">
      <button class="ghost sm" onclick="exportState()">⬇ Esporta JSON</button>
      <button class="ghost sm" onclick="document.getElementById('imp').click()">⬆ Importa JSON</button>
      <input type="file" id="imp" style="display:none" accept="application/json" onchange="importState(event)">
      <button class="ghost sm" onclick="if(confirm('Reset completo ai dati seed?')){localStorage.removeItem('shaer_v2');location.reload()}">↺ Reset seed</button>
      <span class="muted" style="font-size:11px">Unità interna: 100 crediti = 1,00 € · tutto closed-loop</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SHAER.IT SIMULATORE v2 — MOTORE ECONOMICO
   Principi: saldo derivato dal ledger · partita doppia (somma=0)
   · classi credito promo/purchased/earned · take unico sul margine
   ============================================================ */

const SYS = ['SHAER_TREASURY','SHAER_ESCROW','SHAER_SETTLEMENT','SHAER_REVENUE','SHAER_ADV','SHAER_BURN'];
const EUR = c => (c/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const CR  = c => Math.round(c).toLocaleString('it-IT')+' cr';

let state, ui = {role:'BUYER', view:'role', adminTab:'conti', prodTab:'catalogo'};

/* ---------- SEED ---------- */
function seed(){
  return {
    seq:{prod:1,lot:1,cmp:1,ask:1,sug:1,txn:1,dist:1,con:1},
    euroReserve: 0,                 // € realmente versati a copertura
    advPromoBudget: 50000,          // budget promo autorizzato (crediti) finanziato da TREASURY
    users:[
      mkUser('u1','Marco (Buyer)',{BUYER:1},{}, 'buyer_basic'),
      mkUser('u2','Giulia (Buyer)',{BUYER:1},{}, 'buyer_silver'),
      mkUser('u3','Bar Centrale (Seller)',{BUYER:1,SELLER:1},{SELLER:1}, 'seller_std'),
      mkUser('u4','Sport Roma (Seller)',{BUYER:1,SELLER:1},{SELLER:1}, 'seller_std'),
      mkUser('u5','NikeX SpA (Producer)',{PRODUCER:1,SELLER:1},{PRODUCER:1,SELLER:1}, 'producer_std'),
      mkUser('u6','Anna (tri-ruolo)',{BUYER:1,SELLER:1,PRODUCER:1},{SELLER:1,PRODUCER:1}, 'seller_std'),
    ],
    products:[], lots:[], contracts:[], listings:[], campaigns:[], asks:[], suggestions:[], txns:[], dists:[],
    cities:['Roma','Milano','Napoli','Torino'],
    categories:['Calzature','Abbigliamento','Accessori','Elettronica'],
    reviewCategories:[
      {id:'qualita',target:'product',label:'Qualità'},
      {id:'comfort',target:'product',label:'Comfort'},
      {id:'aspettative',target:'product',label:'Aspettative'},
      {id:'cordialita',target:'person',label:'Cordialità'},
      {id:'generoso',target:'person',label:'Generoso'},
      {id:'professionalita',target:'person',label:'Professionalità'},
      {id:'generale',target:'person',label:'Generale'},
    ],
    reviews:[],   // {id,txnId,authorId,authorRole,targetType:'product'|'seller'|'buyer'|'suggester',targetId,scores:{},overall,public,ts}
    feeRules: defaultFeeRules(),
    notifications:[]
  };
}
function mkUser(id,name,roles,verified,plan){return {id,name,roles,verified,plan,rank:50,status:'active',city:'Roma',friends:[]};}
function defaultFeeRules(){return {
  // valori in % ; gerarchia override-utente > piano > globale (qui solo globale+piano)
  sale_take_pct:25, reward_pct:20, cashback_pct:1, seller_keep_pct:54, // split organico C31 (sul margine)
  viewReward:50,                                                        // crediti "view" pagati per suggerimento sotto campagna (dal Reach)
  review_base:20, review_bonus:10,                                      // incentivo recensione (promo): base su invio + bonus mutuo
  promo_use_fee:{buyer_basic:20,buyer_silver:15,buyer_gold:10},          // C32 (sul margine)
  b2b_brackets:[{upTo:50000000,pct:15},{upTo:200000000,pct:10},{upTo:Infinity,pct:3}], // crediti annui (500k€,2m€)
  campaign:{seller_std:{intake:10,payout:15}, producer_std:{intake:8,payout:12}}
};}

/* ---------- LEDGER (partita doppia) ---------- */
function post(d){
  const sum = d.lines.reduce((s,l)=>s+l.amount,0);
  if(Math.round(sum)!==0){ console.error('SBILANCIATA',d); toast('⚠ Distribuzione sbilanciata bloccata'); return false; }
  d.id = 'D'+(state.seq.dist++); d.ts = Date.now();
  state.dists.unshift(d);
  return true;
}
function bal(account, klass=null){
  let s=0;
  for(const d of state.dists) for(const l of d.lines)
    if(l.account===account && (!klass||l.class===klass)) s+=l.amount;
  return s;
}
function wallet(uid, role){ // saldo per classe del wallet (utente,ruolo)
  const a='user:'+uid+':'+role;
  const earned=bal(a,'earned');
  const held = role==='BUYER' ? heldEarned(uid) : 0;   // reward in finestra reso (non spendibile)
  return {promo:bal(a,'promo'), purchased:bal(a,'purchased'), earned:earned,
          heldEarned:held, spendableEarned:earned-held, total:bal(a)};
}
// C43/A6 — reward bloccato finché la finestra reso è aperta: niente clawback in negativo
function heldEarned(uid){
  let h=0;
  for(const t of state.txns){
    if(t.status==='completed' && t.returnWindowOpen){
      for(const d of state.dists){
        if(d.txnId===t.id){
          for(const l of d.lines) if(l.held && l.account==='user:'+uid+':BUYER' && l.amount>0) h+=l.amount;
        }
      }
    }
  }
  return h;
}
// C21c — moltiplicatore rank e split reward pesato sul rank dei suggeritori
function rankMult(uid){const r=userRank(uid);return 0.8+0.4*((r.shown?r.rank:50)/100);}
function splitByRank(total, uids){
  if(!uids.length) return [];
  const m=uids.map(rankMult); const sum=m.reduce((a,b)=>a+b,0)||1;
  const base=m.map(x=>Math.floor(total*x/sum));
  let rem=total-base.reduce((a,b)=>a+b,0);
  const order=uids.map((u,i)=>i).sort((a,b)=>m[b]-m[a]);   // resto ai rank più alti
  for(let k=0;k<rem;k++) base[order[k%order.length]]++;
  return uids.map((u,i)=>({uid:u,amount:base[i]}));
}
function acc(uid,role){return 'user:'+uid+':'+role;}

/* ---------- FEE B2B a scaglioni marginali (annui) ---------- */
function b2bFee(producerId, lotValue){
  // turnover B2B annuo già fatturato dal producer
  const done = state.dists.filter(d=>d.type==='b2b'&&d.producerId===producerId)
                 .reduce((s,d)=>s+(d.lotValue||0),0);
  let remaining=lotValue, base=done, fee=0;
  for(const b of state.feeRules.b2b_brackets){
    if(base>=b.upTo) continue;
    const slot=Math.min(remaining, b.upTo-base);
    fee += slot*(b.pct/100); remaining-=slot; base+=slot;
    if(remaining<=0) break;
  }
  return Math.round(fee);
}

/* ---------- UTENTE / RUOLO ---------- */
function curUser(){return state.users.find(u=>u.id===ui.uid)||state.users[0];}
function setUser(uid){ui.uid=uid; const u=curUser(); if(!u.roles[ui.role]) ui.role=Object.keys(u.roles).find(r=>u.roles[r]); render();}
function setRole(r){ui.role=r; ui.view='role'; render();}
function toggleAdmin(){ui.view = ui.view==='admin'?'role':'admin'; render();}

/* ---------- helper UI ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function notify(uid,msg){state.notifications.unshift({uid,msg,ts:Date.now()});}
function save(){localStorage.setItem('shaer_v2',JSON.stringify(state));}
function opt(arr,val,lab){return arr.map(a=>`<option value="${val(a)}" ${a._sel?'selected':''}>${lab(a)}</option>`).join('');}

/* ============================================================
   ON-RAMP & PROMO MINT
   ============================================================ */
function buyCredits(uid,role,eur){
  const cr=Math.round(eur*100);
  if(!post({type:'onramp', lines:[
    {account:'SHAER_TREASURY',class:'purchased',amount:-cr,note:'emissione'},
    {account:acc(uid,role),class:'purchased',amount:cr,note:'acquisto crediti '+eur+'€'}
  ]})) return;
  state.euroReserve += eur;
  toast('Accreditati '+CR(cr)+' (coperti da '+eur+'€)'); save(); render();
}
function mintPromo(uid,amount,reason,role){
  role=role||'BUYER';
  if(state.advPromoBudget<amount){toast('Budget promo ADV esaurito');return false;}
  if(!post({type:'promo_mint', lines:[
    {account:'SHAER_TREASURY',class:'promo',amount:-amount,note:reason},
    {account:acc(uid,role),class:'promo',amount:amount,note:reason}
  ]})) return false;
  state.advPromoBudget-=amount; return true;
}

/* ============================================================
   RECENSIONI (10 stelle) — incentivo promo, double-blind buyer↔seller,
   rank bayesiano (C41), recensione suggeritori (sugg. 2)
   ============================================================ */
function catsFor(targetType){ // categorie attive per tipo
  const t = targetType==='product'?'product':'person';
  return state.reviewCategories.filter(c=>c.target===t && c.active!==false);
}
function alreadyReviewed(txnId,authorId,targetType,targetId){
  return state.reviews.some(r=>r.txnId===txnId&&r.authorId===authorId&&r.targetType===targetType&&r.targetId===targetId);
}
function submitReview(txnId,targetType,targetId,scores,authorRole){
  const txn=state.txns.find(t=>t.id===txnId); if(!txn||txn.status!=='completed'){toast('Recensione solo su ordine completato');return;}
  const author=ui.uid;
  if((targetType!=='product') && targetId===author){toast('Auto-recensione non ammessa');return;}
  if(alreadyReviewed(txnId,author,targetType,targetId)){toast('Hai già recensito');return;}
  const cats=catsFor(targetType);
  const vals=cats.map(c=>scores[c.id]).filter(v=>v>=1&&v<=10);
  if(vals.length!==cats.length){toast('Vota tutte le categorie (1–10)');return;}
  const overall=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
  // pubbliche subito se non hanno controparte; buyer↔seller in double-blind
  const mutualPair = (targetType==='seller'||targetType==='buyer');
  const rev={id:'R'+(state.reviews.length+1),txnId,authorId:author,authorRole,targetType,targetId,scores:{...scores},overall,public:!mutualPair,ts:Date.now()};
  state.reviews.push(rev);
  // incentivo base (promo) all'autore, nel wallet del ruolo con cui ha agito
  mintPromo(author,state.feeRules.review_base,'recensione '+targetType,authorRole);
  // double-blind: se esiste la recensione reciproca, rendi entrambe pubbliche + bonus a entrambi
  if(mutualPair){
    const otherDir = targetType==='seller' ? 'buyer' : 'seller';
    const recip=state.reviews.find(r=>r.txnId===txnId&&r.targetType===otherDir);
    if(recip){
      rev.public=true; recip.public=true;
      mintPromo(rev.authorId,state.feeRules.review_bonus,'bonus recensione mutua',rev.authorRole);
      mintPromo(recip.authorId,state.feeRules.review_bonus,'bonus recensione mutua',recip.authorRole);
      toast('Recensioni reciproche complete → pubbliche + bonus');
    } else {
      toast('Recensione inviata (+'+CR(state.feeRules.review_base)+' promo) — pubblica quando recensisce anche l\'altra parte');
    }
  } else {
    toast('Recensione inviata (+'+CR(state.feeRules.review_base)+' promo)');
  }
  if(targetType==='product') notify(txn.sellerId,'Nuova recensione sul prodotto');
  save(); render();
}
function personReviews(uid){return state.reviews.filter(r=>r.targetType!=='product'&&r.targetId===uid);}
function productReviews(pid){return state.reviews.filter(r=>r.targetType==='product'&&r.targetId===pid);}
function bayes(list){
  const C=5, m=5.0;  // prior: 5 voti virtuali a media 5.0 (scala 1–10)
  const n=list.length, sum=list.reduce((a,r)=>a+r.overall,0);
  const avg=(C*m+sum)/(C+n);                  // media bayesiana su scala 1–10
  return {n, avg, rank:Math.round(avg*10), shown:n>=3};  // rank 0–100
}
function userRank(uid){return bayes(personReviews(uid));}
function starColor(rank,shown){
  if(!shown) return '#cbd5e1';                // grigio: rank provvisorio (<3 recensioni)
  // gradiente rosso(0) → arancione(10)
  const t=Math.max(0,Math.min(100,rank))/100;
  const r1=[220,38,38], r2=[255,122,24];      // #dc2626 → #ff7a18
  const c=r1.map((v,i)=>Math.round(v+(r2[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function starBadge(uid){
  const u=state.users.find(x=>x.id===uid); if(!u) return '';
  const r=userRank(uid);
  return `<span onclick="showProfile('${uid}')" title="rank ${r.shown?r.rank:'provvisorio'} · ${r.n} recensioni" style="cursor:pointer;color:${starColor(r.rank,r.shown)};font-weight:800">★ ${r.shown?(r.avg).toFixed(1):'—'}</span>`;
}
function showProfile(uid){ui.view='profile'; ui.profileId=uid; render();}

/* ============================================================
   PRODUCER: prodotti, lotti B2B
   ============================================================ */
function createProduct(f){
  const id='PRD-'+String(state.seq.prod++).padStart(3,'0');
  state.products.push({id,producerId:ui.uid,name:f.name,category:f.cat,
    compliance:{expiry:f.expiry,origin:f.origin,factory:f.factory,ean:f.ean},approved:false});
  notify('admin','Nuovo prodotto da approvare: '+f.name);
  toast('Prodotto creato — in attesa di approvazione admin'); save(); render();
}
function createLot(f){
  const p=state.products.find(x=>x.id===f.productId);
  if(!p){toast('Seleziona un prodotto');return;}
  if(!p.approved){toast('Prodotto non ancora approvato');return;}
  const id='LOT-'+String(state.seq.lot++).padStart(3,'0');
  state.lots.push({id,productId:f.productId,producerId:ui.uid,
    unitPrice:Math.round(f.unit*100),qty:f.qty,qtyLeft:f.qty,
    transport:Math.round(f.transport*100),moq:f.moq,maxOrder:f.maxOrder,geo:f.geo||'IT'});
  toast('Lotto B2B pubblicato'); save(); render();
}

/* ============================================================
   SELLER: acquisto B2B (prepagato), vetrina, campagne, vendita
   ============================================================ */
function buyLot(lotId,qty){
  const lot=state.lots.find(l=>l.id===lotId); if(!lot)return;
  qty=parseInt(qty);
  if(qty<lot.moq){toast('Sotto il minimo d\'ordine (MOQ '+lot.moq+')');return;}
  if(qty>lot.maxOrder){toast('Oltre il massimo per ordine ('+lot.maxOrder+')');return;}
  if(qty>lot.qtyLeft){toast('Quantità non disponibile');return;}
  const value=lot.unitPrice*qty;                 // valore B2B (trasporto escluso ai fini fee)
  const seller=ui.uid, producer=lot.producerId;
  const w=wallet(seller,'SELLER');
  if(w.purchased < value+lot.transport){toast('Crediti purchased insufficienti — acquista crediti');return;}
  const fee=b2bFee(producer, value);             // la fee la paga il PRODUCER
  // distribuzione bilanciata: seller paga (value+trasporto), producer incassa, producer paga fee a REVENUE
  const ok=post({type:'b2b',producerId:producer,lotValue:value, lines:[
    {account:acc(seller,'SELLER'),class:'purchased',amount:-(value+lot.transport),note:'acquisto B2B '+lot.productId},
    {account:acc(producer,'PRODUCER'),class:'earned',amount:(value+lot.transport),note:'vendita B2B'},
    {account:acc(producer,'PRODUCER'),class:'earned',amount:-fee,note:'fee B2B'},
    {account:'SHAER_REVENUE',class:'earned',amount:fee,note:'fee B2B '+lot.productId}
  ]});
  if(!ok)return;
  lot.qtyLeft-=qty;
  // contratto con agreed_price versionato (snapshot del prezzo B2B unitario)
  const cid='CON-'+String(state.seq.con++).padStart(3,'0');
  state.contracts.push({id:cid,sellerId:seller,producerId:producer,productId:lot.productId,
    agreedPrice:lot.unitPrice,version:1,validFrom:Date.now(),qty,
    unitPrice:lot.unitPrice,transport:lot.transport,fee,total:value+lot.transport,producerNet:value+lot.transport-fee});
  toast('Acquistati '+qty+' pz · Seller paga '+CR(value+lot.transport)+' · Producer netto '+CR(value+lot.transport-fee)+' · fee '+CR(fee)+' → Shaer.it'); save(); render();
}
function createListing(f){
  const con=state.contracts.find(c=>c.id===f.contractId && c.sellerId===ui.uid);
  if(!con){toast('Serve un contratto B2B');return;}
  const resale=Math.round(f.resale*100);
  if(resale<=con.agreedPrice){toast('Il prezzo di rivendita deve superare il B2B');return;}
  state.listings.push({id:'L'+state.listings.length,sellerId:ui.uid,productId:con.productId,
    contractId:con.id,resalePrice:resale,agreedPrice:con.agreedPrice});
  toast('Prodotto in vetrina'); save(); render();
}
function createCampaign(f){
  const id='CMP-'+String(state.seq.cmp++).padStart(3,'0');
  const creatorRole = curUser().roles.PRODUCER && ui.role==='PRODUCER' ? 'PRODUCER':'SELLER';
  const amount=Math.round(f.budget*100);
  const w=wallet(ui.uid,creatorRole);
  if(w.purchased<amount){toast('Crediti purchased insufficienti per il budget');return;}
  // fee intake + riserva payout riconosciute subito (modello semplificato del simulatore)
  const plan = creatorRole==='PRODUCER'?'producer_std':'seller_std';
  const cf=state.feeRules.campaign[plan];
  const intake=Math.round(amount*cf.intake/100), reserve=Math.round(amount*cf.payout/100);
  const net=amount-intake-reserve;
  const ok=post({type:'cmp_fund',campaignId:id, lines:[
    {account:acc(ui.uid,creatorRole),class:'purchased',amount:-amount,note:'budget campagna'},
    {account:'SHAER_REVENUE',class:'earned',amount:intake+reserve,note:'fee campagna (intake+riserva)'},
    {account:'adv:'+id,class:'purchased',amount:net,note:'minipool netto'}
  ]});
  if(!ok)return;
  const reachQ=Math.round(net*f.reachPct/100), saleQ=net-reachQ;
  state.campaigns.push({id,productId:f.productId,geo:f.geo||'IT',
    creators:[{userId:ui.uid,role:creatorRole,amount}],whitelist:f.whitelist||'',
    reachQ,saleQ,reachLeft:reachQ,saleLeft:saleQ,reachPerDay:Math.round(f.reachDay*100),
    status:'active',net});
  // notifica al producer del prodotto se la campagna è di un seller
  const prod=state.products.find(p=>p.id===f.productId);
  if(prod && prod.producerId!==ui.uid) notify(prod.producerId,'Un seller ha lanciato una campagna sul tuo prodotto '+prod.name);
  toast('Campagna '+id+' attiva · minipool '+CR(net)); save(); render();
}
function campaignForSale(productId, sellerId){
  return state.campaigns.find(c=>{
    if(c.productId!==productId || c.status!=='active') return false;
    const creator=c.creators[0];
    if(creator.role==='PRODUCER') return true;            // il producer promuove presso qualsiasi seller (C34)
    const wl=c.whitelist? c.whitelist.split(',').map(s=>s.trim()).filter(Boolean):[];
    return c.creators.some(cr=>cr.userId===sellerId) || wl.includes(sellerId); // campagna seller: creatore + whitelist
  });
}

/* ============================================================
   BUYER: Ask, suggerimenti (coppia), scelta, pagamento
   ============================================================ */
function createAsk(f){
  const id='ASK-'+String(state.seq.ask++).padStart(3,'0');
  state.asks.push({id,buyerId:ui.uid,productHint:f.hint,targeting:f.targeting,geo:f.geo,status:'open',chosen:null});
  toast('Richiesta '+id+' pubblicata'); save(); render();
}
function eligibleSuggesters(){
  // chi ha un contratto/acquisto (può suggerire una coppia) — stima resoconto
  const sellers=[...new Set(state.contracts.map(c=>c.sellerId))];
  return sellers.length;
}
function addSuggestion(askId,productId,sellerId){
  const ask=state.asks.find(a=>a.id===askId); if(!ask||ask.status!=='open'){toast('Ask non disponibile');return;}
  if(state.suggestions.some(s=>s.askId===askId&&s.suggesterId===ui.uid)){toast('Hai già suggerito in questo Ask (1 per Ask)');return;}
  const listing=state.listings.find(l=>l.productId===productId&&l.sellerId===sellerId);
  if(!listing){toast('Quella coppia prodotto+negozio non è in vetrina');return;}
  state.suggestions.push({id:'S'+(state.seq.sug++),askId,suggesterId:ui.uid,productId,sellerId});
  // VIEW CREDIT (engagement): se esiste una campagna attiva sul prodotto, esce SUBITO dal minipool (Reach)
  const camp=campaignForSale(productId,sellerId);
  if(camp){
    const v=Math.min(state.feeRules.viewReward, camp.reachLeft);
    if(v>0){
      post({type:'view',campaignId:camp.id,phase:'engagement',lines:[
        {account:'adv:'+camp.id,class:'purchased',amount:-v,note:'view credit'},
        {account:acc(ui.uid,'BUYER'),class:'earned',amount:v,note:'view credit (engagement)'}]});
      camp.reachLeft-=v;
      if(camp.reachLeft<=0) notify(camp.creators[0].userId,'Budget Reach della campagna '+camp.id+' esaurito');
      toast('Suggerimento inviato · +'+CR(v)+' view dal minipool');
      save(); render(); return;
    }
  }
  toast('Suggerimento (coppia) inviato'); save(); render();
}
function chooseSuggestion(askId,sugId){
  const ask=state.asks.find(a=>a.id===askId); const s=state.suggestions.find(x=>x.id===sugId);
  if(!ask||!s)return;
  ask.chosen=sugId; ask.status='chosen';
  toast('Coppia scelta — procedi al pagamento'); save(); render();
}
function payAndConfirm(askId, klass){
  const ask=state.asks.find(a=>a.id===askId); const s=state.suggestions.find(x=>x.id===ask.chosen);
  const listing=state.listings.find(l=>l.productId===s.productId&&l.sellerId===s.sellerId);
  const buyer=ask.buyerId, seller=s.sellerId;
  if(buyer===seller){toast('Anti-frode: buyer ≠ seller nella stessa TXN (rank/recensione)');return;}
  const resale=listing.resalePrice, margin=resale-listing.agreedPrice;
  const w=wallet(buyer,'BUYER');
  if(w[klass]<resale){toast('Saldo '+klass+' insufficiente');return;}
  const txnId='TXN-'+String(state.seq.txn++).padStart(4,'0');
  const winners=state.suggestions.filter(x=>x.askId===askId&&x.productId===s.productId&&x.sellerId===s.sellerId);
  const camp=campaignForSale(s.productId,seller);
  let lines=[]; let info='';

  if(camp && klass==='purchased'){
    // SOTTO CAMPAGNA: margine non toccato, seller tiene tutto; reward+cashback dal minipool
    const reward=Math.min(Math.round(listing.agreedPrice*0.25), camp.saleLeft); // 25% del B2B
    if(camp.saleLeft<reward||reward<=0){toast('Pool vendita esaurito — campagna in pausa');camp.status='paused';save();render();return;}
    const cashback=Math.round(reward*0.04);
    lines=[
      {account:acc(buyer,'BUYER'),class:'purchased',amount:-resale,note:'pagamento '+txnId},
      {account:acc(seller,'SELLER'),class:'earned',amount:resale,note:'incasso vendita (margine pieno)'},
    ];
    post({type:'sale_pay',txnId,phase:'purchase',lines});
    // payout reward dal minipool, pesato sul rank (C21c)
    const rl=[{account:'adv:'+camp.id,class:'purchased',amount:-(reward),note:'reward campagna'}];
    splitByRank(reward, winners.map(w=>w.suggesterId)).forEach(p=>rl.push({account:acc(p.uid,'BUYER'),class:'earned',amount:p.amount,note:'reward suggerimento',held:true}));
    post({type:'sale_reward',txnId,campaignId:camp.id,phase:'reward',lines:rl});
    // cashback promo
    post({type:'cashback',txnId,campaignId:camp.id,phase:'cashback',lines:[
      {account:'adv:'+camp.id,class:'purchased',amount:-cashback,note:'cashback'},
      {account:acc(buyer,'BUYER'),class:'promo',amount:cashback,note:'cashback'}]});
    camp.saleLeft-=(reward+cashback);
    info='Campagna '+camp.id+': seller tiene il margine pieno; reward '+CR(reward)+' a '+winners.length+' suggeritori; cashback '+CR(cashback);
    if(camp.saleLeft< Math.round(listing.agreedPrice*0.25)){camp.status='paused'; notify(seller,'Campagna '+camp.id+' in pausa: pool vendita sotto soglia');}
  } else {
    // ORGANICO (o pagamento promo): take unico sul margine C31
    const fr=state.feeRules;
    const shaer=Math.round(margin*fr.sale_take_pct/100);
    const reward=Math.round(margin*fr.reward_pct/100);
    const cashback=Math.round(margin*fr.cashback_pct/100);
    const sellerKeep=resale-shaer-reward-cashback; // = agreed + 54% margine
    const sellerClass = klass==='promo'?'promo':'earned'; // R2: promo→seller resta promo
    lines=[
      {account:acc(buyer,'BUYER'),class:klass,amount:-resale,note:'pagamento '+txnId},
      {account:acc(seller,'SELLER'),class:sellerClass,amount:sellerKeep,note:'incasso netto vendita'},
      {account:'SHAER_REVENUE',class:'earned',amount:shaer,note:'take 25% margine'},
      {account:acc(buyer,'BUYER'),class:'promo',amount:cashback,note:'cashback'}
    ];
    // reward ai suggeritori coppia vincente, pesato sul rank (C21c), bloccato in finestra reso
    splitByRank(reward, winners.map(w=>w.suggesterId)).forEach(p=>lines.push({account:acc(p.uid,'BUYER'),class:'earned',amount:p.amount,note:'reward suggerimento',held:true}));
    post({type:'sale_organic',txnId,phase:'purchase',price_snapshot:listing.agreedPrice,lines});
    info='Organico — margine '+CR(margin)+': Shaer '+CR(shaer)+' / reward '+CR(reward)+' a '+winners.length+' / cashback '+CR(cashback)+' / seller '+CR(sellerKeep);
    if(klass==='promo'){
      // fee uso promo a carico del buyer (C32) sul margine, per tier
      const tier=fr.promo_use_fee[curUser().plan]||20;
      const pf=Math.round(margin*tier/100);
      post({type:'promo_use_fee',txnId,phase:'promofee',lines:[
        {account:acc(buyer,'BUYER'),class:'promo',amount:-pf,note:'fee uso promo '+tier+'%'},
        {account:'SHAER_REVENUE',class:'promo',amount:pf,note:'fee uso promo'}]});
      info+=' · fee uso promo buyer '+CR(pf);
    }
  }
  state.txns.push({id:txnId,askId,buyerId:buyer,sellerId:seller,productId:s.productId,
    suggestionId:s.id,status:'completed',paymentClass:klass,returnWindowOpen:true,
    ts:Date.now(), amount:resale, margin:margin, city:(ask.geo||curUser().city||'Roma'),
    nSuggesters: state.suggestions.filter(x=>x.askId===askId).length});
  ask.status='completed';
  notify(seller,'Vendita confermata '+txnId);
  winners.forEach(wn=>notify(wn.suggesterId,'Hai ricevuto un reward per il tuo suggerimento ('+txnId+')'));
  toast('✔ '+txnId+' completata'); console.log(info); save(); render();
}

/* ============================================================
   RESO (punti 4 e 5)
   - rimborsa tutto tranne i crediti "view" (engagement, non legati al TXN)
   - vietato se il buyer ha consigliato quel prodotto
   ============================================================ */
function canReturn(txn){
  if(txn.status!=='completed') return {ok:false,why:'TXN non rimborsabile'};
  if(!txn.returnWindowOpen) return {ok:false,why:'Finestra reso chiusa (reward già rilasciati)'};
  // punto 5: il buyer ha consigliato (suggerito) quel prodotto? → niente reso
  if(state.suggestions.some(s=>s.suggesterId===txn.buyerId && s.productId===txn.productId))
    return {ok:false,why:'Hai consigliato questo prodotto: il reso non è ammesso'};
  return {ok:true};
}
function releaseReturn(txnId){           // C43: chiude la finestra reso → reward sbloccato, reso non più possibile
  const txn=state.txns.find(t=>t.id===txnId); if(!txn||!txn.returnWindowOpen)return;
  txn.returnWindowOpen=false;
  notify(txn.sellerId,'Finestra reso chiusa per '+txnId+': reward suggeritori sbloccato');
  toast('Ricezione confermata · reward rilasciato (reso chiuso)'); save(); render();
}
function returnTxn(txnId){
  const txn=state.txns.find(t=>t.id===txnId); if(!txn)return;
  const chk=canReturn(txn); if(!chk.ok){toast('⛔ '+chk.why);return;}
  // reverso SOLO le distribuzioni legate a questo TXN (pagamento, reward, cashback, take, fee promo).
  // Le distribuzioni 'view' NON sono legate al TXN → restano (punto 4).
  const related=state.dists.filter(d=>d.txnId===txnId &&
    ['sale_pay','sale_organic','sale_reward','cashback','promo_use_fee'].includes(d.type));
  if(!related.length){toast('Nessun movimento da rimborsare');return;}
  related.forEach(d=>{
    post({type:'reversal',txnId,phase:'return',lines:d.lines.map(l=>({account:l.account,class:l.class,amount:-l.amount,note:'reso '+d.type}))});
    // ripristino il minipool campagna se reward/cashback venivano da lì
    if(d.campaignId && (d.type==='sale_reward'||d.type==='cashback')){
      const c=state.campaigns.find(x=>x.id===d.campaignId);
      if(c){ const back=d.lines.filter(l=>l.account==='adv:'+c.id).reduce((s,l)=>s-l.amount,0); c.saleLeft+=back; if(c.status==='paused')c.status='active'; }
    }
  });
  txn.status='returned';
  const ask=state.asks.find(a=>a.id===txn.askId); if(ask) ask.status='returned';
  notify(txn.sellerId,'Reso effettuato per '+txnId);
  toast('↩ Reso '+txnId+': rimborsato tutto tranne i crediti view'); save(); render();
}
function withdraw(uid,role,amount){
  if(!curUser().verified[role]){toast('Ruolo non verificato');return;}
  const w=wallet(uid,role);
  if(w.earned<amount){toast('Solo crediti earned sono prelevabili');return;}
  post({type:'withdraw_burn',lines:[
    {account:acc(uid,role),class:'earned',amount:-amount,note:'richiesta prelievo'},
    {account:'SHAER_BURN',class:'earned',amount:amount,note:'burn — bonifico € manuale'}]});
  state.euroReserve-=amount/100;
  notify('admin','Richiesta prelievo '+CR(amount)+' da '+curUser().name+' — approvare e bonificare');
  toast('Richiesta prelievo inviata (burn + bonifico manuale)'); save(); render();
}
function transferInternal(uid,from,to,klass,amount){
  if(!curUser().verified[from]&&from!=='BUYER'){toast('Ruolo origine non verificato');return;}
  if(!curUser().verified[to]&&to!=='BUYER'){toast('Ruolo destinazione non verificato');return;}
  const w=wallet(uid,from);
  const avail = (klass==='earned' && from==='BUYER') ? w.spendableEarned : w[klass];
  if(avail<amount){toast(klass==='earned'&&w.heldEarned?'Earned insufficiente (parte bloccata in finestra reso)':'Saldo insufficiente');return;}
  post({type:'transfer',lines:[          // 1:1, classe preservata (R1)
    {account:acc(uid,from),class:klass,amount:-amount,note:'transfer interno'},
    {account:acc(uid,to),class:klass,amount:amount,note:'transfer interno'}]});
  toast('Trasferiti '+CR(amount)+' ('+klass+') '+from+'→'+to); save(); render();
}

function render(){

  document.getElementById('userSel').innerHTML=state.users.map(x=>`<option value="${x.id}" ${x.id===u.id?'selected':''}>${x.name}${x.status==='pending'?' (in attesa)':''}</option>`).join('');
  // role switch
  document.getElementById('roleSwitch').innerHTML=['BUYER','SELLER','PRODUCER'].map(r=>{
    const has=u.roles[r]; const on=ui.role===r;
    return `<button class="${on?'on':''}" ${has?'':'disabled'} onclick="setRole('${r}')">${r.charAt(0)+r.slice(1).toLowerCase()}${has&&!u.verified[r]&&r!=='BUYER'?' ⚠':''}</button>`;
  }).join('');
  renderWallet();
  // pulsante admin attivo?
  const ab=document.getElementById('adminBtn');
  if(ab){ ab.style.background = ui.view==='admin'?'var(--orange)':'rgba(255,255,255,.12)'; }

  if(ui.view==='register'){

    p.innerHTML=viewRegister();

    if(strip) strip.style.display='none';

    if(strip) strip.style.display='none';
    p.innerHTML=`<div class="card" style="border-color:var(--amber)"><h3>⏳ Account in attesa di approvazione</h3><div class="sub">L'account <b>${u.name}</b> è stato registrato ma deve essere approvato dall'admin prima di poter operare. Vai nel pannello Admin → tab "account" per approvarlo (in questa demo).</div></div>`;
  } else if(ui.view==='profile'){

function registerAccount(){

  if(document.getElementById('rgBuyer').checked) roles.BUYER=1;

function askCard(a,mine){
  const sugs=state.suggestions.filter(s=>s.askId===a.id);
  const buyer=state.users.find(u=>u.id===a.buyerId);

  let list;
  if(!sugs.length){ list='<div class="muted" style="font-size:12px">Ancora nessun suggerimento.</div>'; }
  else if(expandedPid){
    // dettaglio: elenco persone che hanno suggerito questo prodotto

    const people=groups[expandedPid].map(s=>{
      const seller=state.users.find(u=>u.id===s.sellerId); const sg=state.users.find(u=>u.id===s.suggesterId);
      const listing=state.listings.find(l=>l.productId===s.productId&&l.sellerId===s.sellerId);

      return `<div class="kv" style="cursor:pointer" onclick="ui.expand={askId:'${a.id}',pid:'${pid}'};render()">
        <span>📦 <b>${prod?prod.name:pid}</b> <span style="color:${starColor(b.rank,b.shown)};font-weight:700">★ ${b.shown?b.avg.toFixed(1):'—'}</span> <span class="muted">· ${groups[pid].length} suggeritori</span></span><span class="muted">›</span></div>`;
    }).join('');

  }
  if(mine && a.status==='chosen'){
    actions=`<div class="hint">Coppia scelta. Paga per completare e distribuire i reward.</div>
      <div class="row"><button class="act sm" onclick="payAndConfirm('${a.id}','purchased')">Paga con purchased</button>

  }
  return `<div class="card"><h3>${a.id} <span class="pill ${a.status==='completed'?'ok':a.status==='chosen'?'wait':''}">${a.status}</span></h3>
    <div class="sub">👤 <b>${buyer?buyer.name:a.buyerId}</b> chiede: "${a.productHint}" · ${a.geo} · ${sugs.length} suggerimenti</div>

  const lot=state.lots.find(l=>l.id===document.getElementById('lotSel').value); if(!lot)return;
  const qty=parseInt(document.getElementById('lotQty').value)||0;
  const val=lot.unitPrice*qty; const fee=b2bFee(lot.producerId,val);
  document.getElementById('b2bPrev').innerHTML=`Valore lotto <b>${EUR(val)}</b> + trasporto ${EUR(lot.transport)}<br>
    → <b>Seller paga ${EUR(val+lot.transport)}</b> · Producer riceve netto <b>${EUR(val+lot.transport-fee)}</b> · <b>Shaer.it incassa ${EUR(fee)}</b> di fee B2B (a carico del producer, scaglione annuo)`;
}
function previewCampaign(){
  const budget=Math.round((parseFloat(document.getElementById('cmpBudget').value)||0)*100);
  const reachPct=parseInt(document.getElementById('cmpReach').value)||0;
  const reachDay=Math.round((parseFloat(document.getElementById('cmpReachDay').value)||0)*100);
  const plan = (curUser().roles.PRODUCER&&ui.role==='PRODUCER')?'producer_std':'seller_std';
  const cf=state.feeRules.campaign[plan];
  const intake=Math.round(budget*cf.intake/100), reserve=Math.round(budget*cf.payout/100);
  const net=budget-intake-reserve; const reachQ=Math.round(net*reachPct/100), saleQ=net-reachQ;
  const days=reachDay?Math.floor(reachQ/reachDay):0;
  // stima vendite: reward indicativo 25% di un B2B medio in vetrina
  const list=state.listings.filter(l=>l.productId===document.getElementById('cmpProd').value)[0];
  const reward=list?Math.round(list.agreedPrice*0.25):0;
  const sales=reward?Math.floor(saleQ/reward):0;
  let warn = (list && saleQ<reward)?' ⚠ pool vendita non copre nemmeno 1 reward':'';
  document.getElementById('cmpPrev').innerHTML=`Fee Shaer ${CR(intake+reserve)} · minipool netto <b>${CR(net)}</b> → Reach ${CR(reachQ)} (≈${days} giorni) / Vendita ${CR(saleQ)} (≈<b>${sales}</b> vendite finanziate)${warn}`;
}
function simReachDay(cid){
  const c=state.campaigns.find(x=>x.id===cid); if(!c||c.status!=='active')return;
  if(c.reachLeft<c.reachPerDay){toast('Reach esaurito');c.status='paused';save();render();return;}
  // paga i suggeritori del prodotto (qualsiasi Ask) — engagement, parti uguali
  const sg=[...new Set(state.suggestions.filter(s=>s.productId===c.productId).map(s=>s.suggesterId))];
  if(!sg.length){toast('Nessun suggeritore del prodotto ancora');return;}
  const each=Math.floor(c.reachPerDay/sg.length); let rem=c.reachPerDay-each*sg.length;
  const lines=[{account:'adv:'+c.id,class:'purchased',amount:-c.reachPerDay,note:'reach day'}];
  sg.forEach((id,i)=>lines.push({account:acc(id,'BUYER'),class:'earned',amount:each+(i<rem?1:0),note:'reach engagement'}));
  post({type:'reach',campaignId:cid,phase:'reach_day',lines});
  c.reachLeft-=c.reachPerDay;
  toast('Reach distribuito a '+sg.length+' suggeritori'); save(); render();
}

function producerSim(){
  return `<div class="card"><h3>📊 Simulatore finanziario (con vs senza campagna)</h3><div class="sub">Costi esterni in €; flussi piattaforma in crediti+€. Modifica e ricalcola.</div>
    <div class="grid g3">
      <div><label>BOM €/unità (materiali)</label><input id="sBom" type="number" value="1.8" oninput="calcSim()"></div>
      <div><label>Altri COGS €/unità</label><input id="sCogs" type="number" value="0.9" oninput="calcSim()"></div>
      <div><label>Prezzo B2B €/unità</label><input id="sPrice" type="number" value="4.5" oninput="calcSim()"></div>
    </div>
    <div class="grid g3">
      <div><label>Unità vendute</label><input id="sUnits" type="number" value="1000" oninput="calcSim()"></div>
      <div><label>Costi fissi €</label><input id="sFixed" type="number" value="800" oninput="calcSim()"></div>
      <div><label>Spesa campagna €</label><input id="sCampaign" type="number" value="2000" oninput="calcSim()"></div>
    </div>
    <div class="grid g3"><div><label>Nuovi buyer acquisiti</label><input id="sCac" type="number" value="120" oninput="calcSim()"></div>
      <div><label>Investimento € (per ROI)</label><input id="sInv" type="number" value="5000" oninput="calcSim()"></div></div>
    <div id="simOut" class="grid g3" style="margin-top:14px"></div>
  </div>`;
}
function calcSim(){
  const g=id=>parseFloat(document.getElementById(id).value)||0;
  const bom=g('sBom'),cogsX=g('sCogs'),price=g('sPrice'),units=g('sUnits'),fixed=g('sFixed'),camp=g('sCampaign'),cacN=g('sCac'),inv=g('sInv');
  const cogs=(bom+cogsX);
  const REV=price*units;
  const COGS=cogs*units;
  const GP=REV-COGS; const GPpct=REV?GP/REV*100:0;
  // fee B2B stimata (scaglione iniziale 15% sul valore in crediti)
  const feeB2B=REV* (0.15);
  const NP=GP-fixed-camp-feeB2B;
  const EBITDA=NP+fixed*0; // semplificato: NP prima di interessi/imposte/amm.
  const contrib=price-cogs; const BEP=contrib>0?Math.ceil(fixed/contrib):'∞';
  const ROI=inv?NP/inv*100:0;
  const CAC=cacN?camp/cacN:0;
  const CF=NP; // prepagato: cassa ≈ NP
  const box=(l,v,s)=>`<div class="card stat"><div class="muted" style="font-size:11px">${l}</div><div class="big">${v}</div><div class="muted" style="font-size:11px">${s||''}</div></div>`;
  document.getElementById('simOut').innerHTML=
    box('REV',EUR(REV*100),'ricavo')+
    box('COGS',EUR(COGS*100),'BOM+produzione')+
    box('GP',EUR(GP*100),GPpct.toFixed(0)+'% margine lordo')+
    box('Fee B2B',EUR(feeB2B*100),'stima 15%')+
    box('NP',EUR(NP*100),'utile netto')+
    box('EBITDA',EUR(EBITDA*100),'')+
    box('BEP',BEP,'unità di pareggio')+
    box('ROI',ROI.toFixed(0)+'%','')+
    box('CAC',EUR(CAC*100),'per nuovo buyer');
}

function starBuckets(list){

// A9 — cicli reciproci sospetti: A vende a B e B vende ad A
function suspiciousCycles(){
  const sold={}; state.txns.forEach(t=>{sold[t.sellerId+'>'+t.buyerId]=true;});
  const seen={}, out=[];
  state.txns.forEach(t=>{
    if(sold[t.buyerId+'>'+t.sellerId]){
      const key=[t.sellerId,t.buyerId].sort().join('~');
      if(!seen[key]){
        seen[key]=true;
        const a=state.users.find(u=>u.id===t.sellerId), b=state.users.find(u=>u.id===t.buyerId);
        const mutual=state.reviews.some(r=>r.authorId===t.sellerId&&r.targetId===t.buyerId)&&state.reviews.some(r=>r.authorId===t.buyerId&&r.targetId===t.sellerId);
        out.push({names:(a?a.name:t.sellerId)+' ↔ '+(b?b.name:t.buyerId), mutual});
      }
    }
  });
  return out;
}

/* grafico a linea sottile stile finanziario */
function lineThin(vals,label,color){
  color=color||'var(--navy)'; if(!vals.length)vals=[0];
  const W=520,H=84,p=14,max=Math.max(1,...vals),n=vals.length;
  const x=i=>p+(n<=1?(W-2*p)/2:i*(W-2*p)/(n-1)), y=v=>H-p-(v/max)*(H-2*p);
  const ln=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ar=`M${x(0).toFixed(1)},${H-p} `+vals.map((v,i)=>`L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')+` L${x(n-1).toFixed(1)},${H-p} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:4px">
    <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#eef2f7" stroke-width="1"/>
    <path d="${ar}" fill="${color}" opacity="0.06"/>
    <path d="${ln}" fill="none" stroke="${color}" stroke-width="1.3"/>
    ${n>1?vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.6" fill="${color}"/>`).join(''):''}
    <text x="${p}" y="11" font-size="10" fill="#64748b">${label}${vals.length?' · '+Math.round(vals[vals.length-1]).toLocaleString('it-IT'):''}</text></svg>`;
}

function cumSeries(items){
  const s=items.filter(t=>t.ts).sort((a,b)=>a.ts-b.ts); let c=0; const out=[];

function gmvSeries(items,field){

function chartBar(rows){
  const max=Math.max(1,...rows.map(r=>r[1]));
  const W=240,bh=22,gap=10,H=rows.length*(bh+gap)+6;
  let y=4,b='';
  rows.forEach(r=>{
    const w=Math.max(2,(r[1]/max)*(W-90));
    b+=`<text x="0" y="${y+15}" font-size="11" fill="#64748b">${r[0]}</text>
        <rect x="78" y="${y}" width="${w}" height="${bh}" rx="5" fill="${r[2]}"></rect>
        <text x="${82+w}" y="${y+15}" font-size="11" font-weight="700" fill="#0d1b2a">${Math.round(r[1]).toLocaleString('it-IT')}</text>`;
    y+=bh+gap;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px">${b}</svg>`;
}
function chartLine(vals){
  const W=520,H=120,p=20,max=Math.max(1,...vals),n=vals.length;
  const x=i=>p+(n<=1?0:i*(W-2*p)/(n-1)), y=v=>H-p-(v/max)*(H-2*p);
  let d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px">
    <line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/>
    <path d="${d}" fill="none" stroke="var(--orange)" stroke-width="2.5"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--orange)"/>`).join('')}
    <text x="${p}" y="14" font-size="11" fill="#64748b">vendite cumulate: ${vals[vals.length-1]}</text>
  </svg>`;
}

/* ---------- export/import ---------- */
function exportState(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shaer_sim_v2.json';a.click();}
function importState(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Stato importato')}catch(err){toast('File non valido')}};r.readAsText(f);}

/* ---------- bootstrap + seed demo data ---------- */
function bootstrap(){
  const saved=localStorage.getItem('shaer_v2');
  if(saved){state=JSON.parse(saved);}
  else{
    state=seed(); ui.uid='u1';
    // città e amici demo
    const cityMap={u1:'Roma',u2:'Milano',u3:'Roma',u4:'Roma',u5:'Milano',u6:'Napoli'};
    state.users.forEach(u=>{u.city=cityMap[u.id]||'Roma';});
    state.users.find(u=>u.id==='u1').friends=['u2','u3','u6'];
    state.users.find(u=>u.id==='u2').friends=['u1','u4'];
    state.users.find(u=>u.id==='u6').friends=['u1','u5'];
    // crea dati demo coerenti col motore
    // 1) producer u5 crea prodotto + approvazione + lotto
    ui.uid='u5'; ui.role='PRODUCER';
    createProductSilent('u5','NikeX Runner','Calzature');
    state.products[0].approved=true;
    // lotto
    state.lots.push({id:'LOT-001',productId:'PRD-001',producerId:'u5',unitPrice:450,qty:1000,qtyLeft:1000,transport:50,moq:50,maxOrder:500,geo:'IT'});
    state.seq.lot=2;
    // 2) crediti ai seller per comprare B2B
    buyCreditsSilent('u4','SELLER',1000);
    buyCreditsSilent('u3','SELLER',300);
    buyCreditsSilent('u1','BUYER',50);
    buyCreditsSilent('u2','BUYER',50);
    // promo ai buyer (engagement)
    mintPromo('u1',300,'registrazione+consigli'); mintPromo('u2',200,'registrazione');
    // 3) seller u4 compra lotto, mette in vetrina
    ui.uid='u4'; ui.role='SELLER';
    buyLotSilent('u4','LOT-001',200);
    state.listings.push({id:'L0',sellerId:'u4',productId:'PRD-001',contractId:state.contracts[0].id,resalePrice:600,agreedPrice:450});
    ui.uid='u1'; ui.role='BUYER';
    save();
  }
  if(!ui.uid) ui.uid='u1';
  render();
}
function createProductSilent(pid,name,cat){const id='PRD-'+String(state.seq.prod++).padStart(3,'0');state.products.push({id,producerId:pid,name,category:cat,compliance:{expiry:'n/a',origin:'Vietnam',factory:'Plant #4',ean:'800123'},approved:false});}
function buyCreditsSilent(uid,role,eur){const cr=Math.round(eur*100);post({type:'onramp',lines:[{account:'SHAER_TREASURY',class:'purchased',amount:-cr,note:'emissione'},{account:acc(uid,role),class:'purchased',amount:cr,note:'seed crediti'}]});state.euroReserve+=eur;}
function buyLotSilent(seller,lotId,qty){const lot=state.lots.find(l=>l.id===lotId);const value=lot.unitPrice*qty;const fee=b2bFee(lot.producerId,value);post({type:'b2b',producerId:lot.producerId,lotValue:value,lines:[{account:acc(seller,'SELLER'),class:'purchased',amount:-(value+lot.transport),note:'B2B seed'},{account:acc(lot.producerId,'PRODUCER'),class:'earned',amount:(value+lot.transport),note:'B2B'},{account:acc(lot.producerId,'PRODUCER'),class:'earned',amount:-fee,note:'fee'},{account:'SHAER_REVENUE',class:'earned',amount:fee,note:'fee B2B'}]});lot.qtyLeft-=qty;const cid='CON-'+String(state.seq.con++).padStart(3,'0');state.contracts.push({id:cid,sellerId:seller,producerId:lot.producerId,productId:lot.productId,agreedPrice:lot.unitPrice,version:1,validFrom:Date.now(),qty,unitPrice:lot.unitPrice,transport:lot.transport,fee,total:value+lot.transport,producerNet:value+lot.transport-fee});}

bootstrap();
</script>
